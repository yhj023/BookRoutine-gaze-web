# gaze-web (정적 파일만, 서버 기능 없음) — EC2 nginx 설정
# 1) gaze.example.com 을 실제 서브도메인으로 바꾸기 (두 군데: server_name)
# 2) 서버에 복사: Ubuntu → /etc/nginx/sites-available/gaze + sites-enabled 에 링크
#                 Amazon Linux → /etc/nginx/conf.d/gaze.conf
# 3) sudo nginx -t  (문법 확인, 기존 백엔드 설정도 같이 검사됨) → sudo systemctl reload nginx
# 4) https: sudo certbot --nginx -d gaze.example.com  (certbot 이 443 설정을 이 파일에 덧붙임)
# 자세한 순서는 deploy/DEPLOY.md

server {
    listen 80;
    listen [::]:80;
    server_name gaze.example.com;

    # npm run build 로 만든 dist/ 안의 파일을 여기에 올림
    root /var/www/gaze-web;
    index index.html;

    # 압축: wasm(약 13MB짜리 여러 개)·js·모델이 크게 줄어듦
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/javascript text/css application/json application/octet-stream image/svg+xml;

    # wasm 은 반드시 application/wasm (아니면 브라우저가 빠른 로딩을 못 씀)
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 모델 파일 (.task, .tflite): 크고 잘 안 바뀜 → 7일 캐시
    location ~* \.(task|tflite)$ {
        types { }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # 빌드할 때마다 이름(해시)이 바뀌는 js·css → 1년 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 은 매번 새로 (새 버전을 올리면 바로 보이게)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /tech, /try, /collect 로 바로 들어와도 화면이 열리게 (없는 주소는 index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
